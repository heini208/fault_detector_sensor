[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = CRLF
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    https://github.com/Seeed-Studio/Grove_3_Axis_Compass_V2.0_BMM150.git#179a2bff4e7b7861bac9a55cafe0f999f38cf065
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    +<acquisition_state_machine.cpp>
    +<line_command_buffer.cpp>
    -<main.cpp>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic
